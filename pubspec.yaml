name: cmo_app
description: A modern CMO (Change Meter Owner) application with offline support
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI Components
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  lottie: ^3.0.0
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1

  # State Management
  provider: ^6.1.1
  get: ^4.6.6

  # Local Database
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  path: ^1.8.3

  # Camera & Barcode Scanner
  camera: ^0.11.3
  image_picker: ^1.0.4
  image: ^4.1.3
  mobile_scanner: ^5.2.3

  # OCR - Text Recognition
  google_mlkit_text_recognition: ^0.14.0

  # Authentication & Security
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  crypto: ^3.0.3

  # Network & API
  http: ^1.1.0
  dio: ^5.4.0
  connectivity_plus: ^7.0.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.2.1
  permission_handler: ^12.0.1
  share_plus: ^12.0.1
  geolocator: ^13.0.1

  # Map
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Firebase (for push notifications - optional)
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

#  fonts:
#    - family: CustomIcons
#      fonts:
#        - asset: assets/fonts/CustomIcons.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon.png"
